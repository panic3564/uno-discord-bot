
services:
  uno-discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uno-discord-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - GUILD_ID=${GUILD_ID}
      - BOT_NAME=${BOT_NAME:-UNO Discord Bot}
      - BOT_STATUS=${BOT_STATUS:-Playing UNO with you!}
    volumes:
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
